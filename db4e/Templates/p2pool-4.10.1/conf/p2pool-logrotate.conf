# P2Pool logrotate file
# 
#####################################################################

compress

[[VENDOR_DIR]]/p2pool/[[INSTANCE]]/logs/p2pool.log {
    rotate [[MAX_LOG_FILES]]
    size [[MAX_LOG_SIZE]]
    minsize [[MAX_LOG_SIZE]]
    missingok
    daily
    su root [[DB4E_GROUP]]
    start 1
}
